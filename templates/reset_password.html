<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ZeekGlare — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#020308;--bg2:#0a0f22;--b1:#1a2340;--b2:#243060;
  --accent:#6366f1;--accent2:#818cf8;
  --red:#ef4444;--green:#22c55e;--green2:#4ade80;--amber:#f59e0b;--cyan:#22d3ee;
  --t1:#e2e8f8;--t2:#8ea4c8;--t3:#4a6088;--t4:#1e2d50;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--t1);font-family:'Inter',sans-serif;font-size:13px}
body{display:flex;align-items:center;justify-content:center;padding:30px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(99,102,241,.035) 1px, transparent 1px),linear-gradient(90deg, rgba(99,102,241,.035) 1px, transparent 1px);background-size:44px 44px;pointer-events:none}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.14;pointer-events:none}
.glow.a{width:400px;height:400px;background:#6366f1;top:-100px;left:-100px}
.glow.b{width:340px;height:340px;background:#a855f7;bottom:-80px;right:-80px}

.card{
  width:100%;max-width:440px;position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(10,15,34,.92),rgba(5,8,24,.95));
  backdrop-filter:blur(24px);
  border:1px solid rgba(99,102,241,.2);
  border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 80px rgba(99,102,241,.08);
  animation:in .5s cubic-bezier(.22,1,.36,1);
}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.bar{height:3px;background:linear-gradient(90deg,#6366f1,#818cf8,#a78bfa,#22d3ee,#6366f1);background-size:300% 100%;animation:shift 5s ease infinite}
@keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.body{padding:34px 36px 30px}
h1{font-size:20px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#e2e8f8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11.5px;color:var(--t3);margin-bottom:24px;line-height:1.5}
.field{margin-bottom:14px}
label{display:block;font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
input{
  width:100%;padding:12px 14px;
  background:rgba(5,8,24,.85);border:1px solid var(--b1);
  border-radius:var(--r);color:var(--t1);
  font-size:13.5px;font-family:inherit;outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15);background:rgba(5,8,24,1)}
.pw-strength{display:flex;gap:3px;margin-top:7px;height:3px}
.pw-strength .seg{flex:1;background:var(--b1);border-radius:2px;transition:background .3s}
.pw-strength.s1 .seg:nth-child(-n+1){background:var(--red)}
.pw-strength.s2 .seg:nth-child(-n+2){background:var(--amber)}
.pw-strength.s3 .seg:nth-child(-n+3){background:var(--cyan)}
.pw-strength.s4 .seg{background:var(--green)}
button{
  width:100%;padding:13px;margin-top:8px;
  background:linear-gradient(135deg,var(--accent),#4f52d1 40%,#7c3aed);
  border:none;border-radius:var(--r);
  color:#fff;font-size:13.5px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;
  transition:all .25s ease;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(99,102,241,.4)}
button:disabled{opacity:.45;cursor:not-allowed}
#msg{display:none;margin-top:14px;padding:11px 14px;border-radius:var(--r);font-size:12px;line-height:1.55}
#msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
#msg.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green2)}
.back{display:block;text-align:center;margin-top:18px;font-size:11.5px;color:var(--accent2);text-decoration:none}
.back:hover{color:var(--t1)}
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>

<div class="card">
  <div class="bar"></div>
  <div class="body">
    <h1>🔑 Set a new cipher</h1>
    <p class="sub">Choose a strong password for your ZeekGlare operator account. Use at least 8 characters with a mix of cases, numbers, and symbols.</p>

    <form id="rp-form" autocomplete="off">
      <div class="field">
        <label for="pw">New Password</label>
        <input type="password" id="pw" placeholder="••••••••••••" required minlength="8">
        <div class="pw-strength" id="strength"><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
      </div>
      <div class="field">
        <label for="pw2">Confirm Password</label>
        <input type="password" id="pw2" placeholder="••••••••••••" required minlength="8">
      </div>
      <button type="submit" id="btn">Update Password</button>
      <div id="msg"></div>
    </form>
    <a class="back" href="/auth/login">← Back to sign in</a>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
const pw = document.getElementById('pw');
const pw2 = document.getElementById('pw2');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
const strength = document.getElementById('strength');

function pwScore(p){
  let s=0;
  if(p.length>=8)s++;
  if(p.length>=12)s++;
  if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;
  if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;
  return Math.min(s,4);
}
pw.addEventListener('input', ()=>{
  strength.className = 'pw-strength s'+pwScore(pw.value);
});

document.getElementById('rp-form').addEventListener('submit', async e=>{
  e.preventDefault();
  msg.style.display = 'none';
  if(pw.value !== pw2.value){
    msg.className = 'err'; msg.style.display='block';
    msg.textContent = 'Passwords do not match.';
    return;
  }
  if(pw.value.length < 8){
    msg.className = 'err'; msg.style.display='block';
    msg.textContent = 'Password must be at least 8 characters.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Updating…';
  try{
    const r = await fetch('/auth/reset/' + encodeURIComponent(TOKEN), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pw.value, confirm: pw2.value})
    });
    const d = await r.json().catch(()=>({}));
    msg.style.display = 'block';
    if(r.ok){
      msg.className = 'ok';
      msg.textContent = (d.message || 'Password updated.') + ' Redirecting to sign in…';
      btn.textContent = '✓ Updated';
      setTimeout(()=>{ window.location.href = '/auth/login'; }, 1500);
    } else {
      msg.className = 'err';
      msg.textContent = d.error || 'Unable to reset password.';
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  }catch(err){
    msg.className = 'err'; msg.style.display='block';
    msg.textContent = 'Connection error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
