events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Disable buffering for SSE
    proxy_buffering         off;
    proxy_cache             off;

    upstream zeekglare {
        server app:5000;
        keepalive 32;
    }

    upstream xploiter {
        server app:5001;
        keepalive 8;
    }

    upstream misc {
        server app:5002;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        # Gzip static assets
        gzip on;
        gzip_types text/css application/javascript application/json text/plain;
        gzip_min_length 1024;

        # SSE streams — no buffering, long timeout
        location ~ ^/api/(stream|domain-stream|recon/stream|fuzz/stream|ports/stream|pd/stream|wpscan/stream|crawler/stream|threatblitz/stream|sudomy/stream) {
            proxy_pass         http://zeekglare;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_buffering    off;
            proxy_cache        off;
            add_header         X-Accel-Buffering no;
        }

        # Xpl03tEr dashboard
        location /xploiter/ {
            proxy_pass         http://xploiter/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Misc Tools dashboard
        location /misc/ {
            proxy_pass         http://misc/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # API
        location /api/ {
            proxy_pass         http://zeekglare;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # Everything else
        location / {
            proxy_pass         http://zeekglare;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
